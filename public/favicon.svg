<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">ATM favicon</title>
  <desc id="desc">Purple ATM monogram on a white rounded card with transparent outer space.</desc>

  <!-- White 1rem-style rounded card; outer SVG area remains transparent. -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#FFFFFF"/>

  <!-- Ascent stroke -->
  <g fill="none" stroke="#4B075F" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 26 C18 19 24 17 31 17 C37 17 41 14 46 10 C50 7 56 8 58 9" stroke-width="3.5"/>
    <path d="M14 26 C11 30 11 34 12 37" stroke-width="3.5"/>
  </g>

  <!-- ATM monogram -->
  <text x="14" y="50" fill="#4B075F" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" letter-spacing="-2.2">ATM</text>
</svg>
